[project]
name = "machine-data-model"
version = "1.0.0"
description = "Machine data model for the Glacier platform."
authors = [{ name = "Sebastiano Gaiardelli", email = "sebastiano.gaiardelli@univr.it" }]
license = "BSD-2-Clause"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "unitsnet-py>=0.1.154,<0.2",
    # Connector deps remain core in Phase 1 to keep this phase behavior-preserving.
    # Phase 2 moves them to [project.optional-dependencies].
    "asyncua==1.1.6",
    "aiomqtt>=2.5.1,<3",
    "msgpack>=1.1.2,<2",
]

[dependency-groups]
dev = [
    "radon>=6.0.1,<7",
    "lizard>=1.17.13,<2",
    "pre-commit>=4.0.1,<5",
    "mypy>=1.13.0,<2",
    "ruff>=0.8.3,<0.9",
    "tox>=4.23.2,<5",
    "tox-uv>=1.13,<2",
    "docker>=7.1.0,<8",
]
test = ["pytest>=8.3.4,<9", "pytest-cov>=6.0.0,<7"]
docs = [
    "sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "sphinx-autoapi>=3.4.0,<4",
    "furo>=2024.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["machine_data_model"]


[tool.ruff]
# Google style uses 80 chars
line-length = 80
target-version = "py311" # Minimum supported Python version

[tool.ruff.lint]
# Google Python Style Guide compliant rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "D",      # pydocstyle (docstring conventions)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D105",   # missing docstring in magic method
    "D107",   # missing docstring in __init__
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # docstrings not required in tests
]

[tool.ruff.lint.pydocstyle]
# Google docstring convention
convention = "google"

[tool.ruff.lint.isort]
# Google style: absolute imports, sorted
known-first-party = ["machine_data_model"]
force-single-line = false
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
